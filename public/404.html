<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>RAC Logistics</title>
    <script>
      // SPA fallback: preserve the full path for BrowserRouter
      // This handles cases where the server returns a 404 for SPA routes
      var segmentCount = 0; // set to 1 if your app is in a subdirectory
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Loading...
  </body>
</html>
