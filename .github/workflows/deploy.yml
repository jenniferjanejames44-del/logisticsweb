name: Build and Deploy React App to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build the React app
      - name: Build app
        run: |
          # Use dist if Vite/Lovable, build if CRA
          if [ -f package.json ]; then
            if grep -q "vite" package.json; then
              npm run build
              echo "Using Vite/Lovable, build output in dist/"
            else
              npm run build
              echo "Using CRA, build output in build/"
            fi
          fi

      # 5️⃣ Deploy to Hostinger domain-specific folder
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./dist/   # Change to ./build/ if CRA
          server-dir: domains/raclogisticltd.com/
          dangerous-clean-slate: true
