name: Build and Deploy React App to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: |
          if [ -f package.json ]; then
            if grep -q "vite" package.json; then
              npm run build
              echo "Vite/Lovable detected, build output: dist/"
            else
              npm run build
              echo "CRA detected, build output: build/"
            fi
          fi

      - name: Create .htaccess for SPA routing
        run: |
          echo "RewriteEngine On" > ./dist/.htaccess
          echo "RewriteBase /" >> ./dist/.htaccess
          echo "RewriteRule ^index\\.html$ - [L]" >> ./dist/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-f" >> ./dist/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-d" >> ./dist/.htaccess
          echo "RewriteRule . /index.html [L]" >> ./dist/.htaccess

      - name: Deploy to Hostinger FTP root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./dist/   # change to ./build/ if CRA
          server-dir: /home/u816393804/domains/raclogisticltd.com/public_html/      # deploy directly to root, NOT public_html
          dangerous-clean-slate: true

